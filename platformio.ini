[env:esp32-s3-usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
    sparkfun/SparkFun u-blox GNSS v3 @ ^3.1.5

[env:esp32-s3-ota]
extends = env:esp32-s3-usb
upload_protocol = espota
upload_port = rtk-base.local ; Или локальный IP платы (например, 192.168.1.55)
upload_flags =
    --auth=admin1234         ; Должен совпадать с OTA_PASSWORD в secrets.h
