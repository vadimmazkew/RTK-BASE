name: PlatformIO CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Create dummy secrets.h from template
        run: cp include/secrets.example.h include/secrets.h

      - name: Build Firmware (ESP32-S3)
        run: pio run -e esp32-s3-usb

      - name: Upload firmware.bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-base-firmware
          path: .pio/build/esp32-s3-usb/firmware.bin
