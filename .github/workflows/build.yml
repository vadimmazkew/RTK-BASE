name: PlatformIO CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Create secrets.h from template
        run: cp include/secrets.example.h include/secrets.h

      - name: Build Firmware (ESP32-S3)
        run: pio run -e esp32-s3-usb

      - name: Merge full flash image for 0x0 address
        run: |
          python -m esptool --chip esp32s3 merge_bin -o .pio/build/esp32-s3-usb/full_firmware_0x0.bin --flash_mode dio --flash_freq 40m --flash_size 16MB 0x0 .pio/build/esp32-s3-usb/bootloader.bin 0x8000 .pio/build/esp32-s3-usb/partitions.bin 0x10000 .pio/build/esp32-s3-usb/firmware.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtk-base-firmware
          path: |
            .pio/build/esp32-s3-usb/full_firmware_0x0.bin
            .pio/build/esp32-s3-usb/firmware.bin
